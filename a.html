html<!DOCTYPE html>

  <style>
    /* The Parent Container */
    .flex-container {
      display: flex;                      /* Activates Flexbox */
      flex-direction: row;                /* Aligns items horizontally (default) */
      justify-content: space-between;     /* Spreads items across the main axis */
      align-items: center;                /* Centers items along the cross axis */
      background-color: #f1f1f1;
      padding: 20px;
    }

    /* The Child Items */
    .flex-item {
      background-color: #4CAF50;
      color: white;
      padding: 20px;
      margin: 10px;
      font-size: 20px;
      text-align: center;
      flex: 1;                            /* Forces items to grow and share space equally */
    }
  </style>
</head>
<body>

  <div class="flex-container">
    <div class="flex-item">Box 1</div>
    <div class="flex-item">Box 2</div>
    <div class="flex-item">Box 3</div>
  </div>

</body>
</html>
