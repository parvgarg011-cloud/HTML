<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
</head>
<body>

    <h1>Login</h1>

    <form action="about.html" method="post">

        <label>Username:</label>
        <input type="text"
               name="username"
               minlength="3"
               maxlength="20"
               required>
        <br><br>

        <label>Password:</label>
        <input type="password"
               name="password"
               minlength="8"
               maxlength="20"
               title="Password must contain 8-20 characters"
               required>
        <br><br>

        <input type="submit" value="Login">

    </form>

</body>
</html>
